<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול צורך, מלאי והזמנות · NoSQL</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>מערכת לניהול צורך, מלאי והזמנות של פריטים מוגבלי חיי מדף</h1>
    <p>עבודת סיכום NoSQL · מתן דידי · רץ מול MongoDB Atlas בזמן אמת ·
      <a href="https://github.com/matandidi/nosql-procurement-assignment" target="_blank" rel="noopener">קוד, סקריפטים ותרשימים ב-GitHub</a>
    </p>
  </header>
  <main>
    <div class="status" id="status" role="status"><span class="chip">בודק חיבור ל-Atlas…</span></div>
    <div id="questions"></div>
  </main>
  <footer>כל הנתונים במערכת פיקטיביים. הגישה למסד היא בקריאה בלבד דרך Netlify Function; אין פרטי חיבור בדפדפן.</footer>

  <template id="question-template">
    <section class="card">
      <h2><span class="num"></span><span class="question-title"></span></h2>
      <p><span class="summary"></span> <span class="badge"></span></p>
      <div class="row">
        <button class="run" type="button">הרץ שאילתה</button>
        <button class="ghost" type="button" aria-expanded="false">הצג pipeline</button>
        <span class="meta" role="status"></span>
      </div>
      <pre class="hidden"></pre>
      <div class="tbl"></div>
    </section>
  </template>
</body>
</html>
