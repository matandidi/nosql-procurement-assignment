:space="preserve" x="990" y="697.25" font-family="Menlo, 'Courier New', monospace" font-size="18" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">  supplier_name: &quot;NorthTech Components&quot;,</text><text xml:space="preserve" x="990" y="731.5" font-family="Menlo, 'Courier New', monospace" font-size="18" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">  country: &quot;Germany&quot;, lead_time_days: 120,</text><text xml:space="preserve" x="990" y="765.75" font-family="Menlo, 'Courier New', monospace" font-size="18" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">  performance_status: &quot;reliable&quot; }</text><path d="M 890 372 H 770" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><text xml:space="preserve" x="830" y="340" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">reference</text><text xml:space="preserve" x="830" y="404" font-family="Menlo, 'Courier New', monospace" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">lines[].item_id</text><text xml:space="preserve" x="830" y="424" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">→ items</text><path d="M 1210 495 V 575" fill="none" stroke="#15803D" stroke-width="4" marker-end="url(#arrow)"/><text xml:space="preserve" x="1235" y="543" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="17" font-weight="700" fill="#15803D" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">reference: supplier_id → suppliers</text><rect x="90" y="880" width="700" height="40" rx="20" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="2"/><text xml:space="preserve" x="440" y="907" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext">Embedding: אצוות וצרכים בתוך הפריט; שורות ההזמנה בתוך ההזמנה</text><rect x="860" y="880" width="670" height="40" rx="20" fill="#E8F7EC" stroke="#E8F7EC" stroke-width="2"/><text xml:space="preserve" x="1195" y="907" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext">References: הזמנה ← פריט, הזמנה ← ספק (מזהים לוגיים + $lookup)</text><text xml:space="preserve" x="1520" y="960" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="19" font-weight="700" fill="#52667A" text-anchor="start" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext">הפריט אינו מחזיק הפניות להזמנות: הזמנות פתוחות משתנות תדיר ונשלפות ב-$lookup לפי item_id.</text>
