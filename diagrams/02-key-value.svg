  <rect x="0" y="0" width="1600" height="1000" fill="#F5F8FB"/>
  <rect x="0" y="0" width="1600" height="14" fill="#087F8C"/>
  <text xml:space="preserve" x="80" y="72" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="42" font-weight="700" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">Key-Value DB</text>
  <text xml:space="preserve" x="1520" y="112" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="22" font-weight="400" fill="#52667A" text-anchor="start" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext">מפתח אחד ← ערך אחד שמכיל את כל האגרגט (blob); המסד אינו מבין את מבנה הערך</text>
  <rect x="70" y="150" width="930" height="800" rx="20" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text xml:space="preserve" x="95" y="190" font-family="Menlo, 'Courier New', monospace" font-size="24" font-weight="700" fill="#2563EB" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Key = item:ITM001&gt;</text><rect x="95" y="210" width="880" height="720" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text xml:space="preserve" x="120" y="245" font-family="Menlo, 'Courier New', monospace" font-size="20" font-weight="700" fill="#52667A" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Value = Object (blob)&gt;</text><rect x="120" y="262" width="830" height="92" rx="14" fill="#EAF2FF" stroke="#2563EB" stroke-width="2"/><text xml:space="preserve" x="138" y="292" font-family="Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#2563EB" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">item</text><text xml:space="preserve" x="138" y="320" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="138" dy="0">mpn: &quot;TMS-100&quot;, name: &quot;Thermal Sensor&quot;, category: &quot;Sensors&quot;,</tspan><tspan x="138" dy="26">shelf_life_months: 60</tspan></text><rect x="120" y="368" width="830" height="140" rx="14" fill="#DDF5F3" stroke="#087F8C" stroke-width="2"/><text xml:space="preserve" x="138" y="398" font-family="Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#087F8C" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">inventory_batches: [</text><text xml:space="preserve" x="138" y="426" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="138" dy="0">{ batch_id: &quot;ITM001-B01&quot;, quantity: 20, expiry_date: 2026-03-31 }</tspan><tspan x="138" dy="26">{ batch_id: &quot;ITM001-B02&quot;, quantity: 30, expiry_date: 2030-12-31 }</tspan><tspan x="138" dy="26">{ batch_id: &quot;ITM001-B03&quot;, quantity: 40, expiry_date: 2031-12-31 } ]</tspan></text><rect x="120" y="522" width="830" height="165" rx="14" fill="#F1EAFE" stroke="#7C3AED" stroke-width="2"/><text xml:space="preserve" x="138" y="552" font-family="Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#7C3AED" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">annual_requirements: [</text><text xml:space="preserve" x="138" y="580" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="138" dy="0">{ year: 2027, planned_usage: 40, safety_stock: 5, attrition_reserve: 5,</tspan><tspan x="138" dy="26">  total_required: 50, required_by_date: 2027-06-30 }</tspan><tspan x="138" dy="26">{ year: 2028, ..., total_required: 60, required_by_date: 2028-06-30 }</tspan><tspan x="138" dy="26">{ year: 2029, ..., total_required: 70, required_by_date: 2029-06-30 } ]</tspan></text><rect x="120" y="701" width="830" height="118" rx="14" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text xml:space="preserve" x="138" y="731" font-family="Menlo, 'Courier New', monospace" font-size="19" font-weight="700" fill="#D97706" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">open_order_lines: [</text><text xml:space="preserve" x="138" y="759" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="138" dy="0">{ po: &quot;PO1001&quot;, supplier_id: &quot;SUP001&quot;, qty: 60, eta: 2027-05-15 }</tspan><tspan x="138" dy="26">{ po: &quot;PO1005&quot;, supplier_id: &quot;SUP001&quot;, qty: 50, eta: 2028-04-01 } ]</tspan></text><text xml:space="preserve" x="950" y="880" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="19" font-weight="700" fill="#52667A" text-anchor="start" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext">המסד רואה את ה-value כ-blob אטום: אין חיפוש לפי שדה פנימי, רק לפי key</text><rect x="1040" y="150" width="490" height="215" rx="20" fill="#E8F7EC" stroke="#15803D" stroke-width="2"/><text xml:space="preserve" x="1062" y="190" font-family="Menlo, 'Courier New', monospace" font-size="22" font-weight="700" fill="#15803D" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Key = supplier:SUP001&gt;</text><rect x="1062" y="208" width="446" height="138" rx="14" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/><text xml:space="preserve" x="1080" y="238" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="700" fill="#15803D" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Value = Object&gt;</text><text xml:space="preserve" x="1080" y="266" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="1080" dy="0">{ name: &quot;NorthTech Components&quot;,</tspan><tspan x="1080" dy="26">  country: &quot;Germany&quot;,</tspan><tspan x="1080" dy="26">  lead_time_days: 120, status: &quot;reliable&quot; }</tspan></text><rect x="1040" y="395" width="490" height="265" rx="20" fill="#FFF4D6" stroke="#D97706" stroke-width="2"/><text xml:space="preserve" x="1062" y="435" font-family="Menlo, 'Courier New', monospace" font-size="22" font-weight="700" fill="#D97706" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Key = po:PO1001&gt;</text><rect x="1062" y="453" width="446" height="190" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text xml:space="preserve" x="1080" y="483" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="700" fill="#D97706" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext">&lt;Value = Object&gt;</text><text xml:space="preserve" x="1080" y="511" font-family="Menlo, 'Courier New', monospace" font-size="17" font-weight="400" fill="#102A43" text-anchor="start" direction="ltr" unicode-bidi="plaintext" style="direction:ltr;unicode-bidi:plaintext"><tspan x="1080" dy="0">{ supplier_id: &quot;SUP001&quot;, status: &quot;open&quot;,</tspan><tspan x="1080" dy="26">  expected_delivery_date: 2027-05-15,</tspan><tspan x="1080" dy="26">  lines: [ { item_id: &quot;ITM001&quot;, qty: 60 },</tspan><tspan x="1080" dy="26">           { item_id: &quot;ITM002&quot;, qty: 30 } ] }</tspan></text><rect x="1040" y="690" width="490" height="260" rx="20" fill="#FFFFFF" stroke="#B8C5D1" stroke-width="2"/><text xml:space="preserve" x="1505" y="730" font-family="Arial, 'Noto Sans Hebrew', sans-serif" font-size="19" font-weight="700" fill="#102A43" text-anchor="start" direction="rtl" unicode-bidi="plaintext" style="direction:rtl;unicode-bidi:plaintext"><tspan x="1505" dy="0">מפתח משמעותי (item:ITM001) ולא מספר רץ.</tspan><tspan x="1505" dy="34">הערך = אגרגט שלם: פריט, אצוות, צרכים</tspan><tspan x="1505" dy="34">ושורות הזמנה פתוחות, באובייקט אחד.</tspan><tspan x="1505" dy="34">כדי לענות &quot;אילו הזמנות מאוחרות?&quot; צריך</tspan><tspan x="1505" dy="34">לשלוף ולפרסר את כל ה-blob של כל פריט.</tspan><tspan x="1505" dy="34">הקשר לספק הוא key ידוע לאפליקציה בלבד.</tspan></text>
</svg>